name: SkillSpring checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Isolated Firebase and browser journeys
        run: npx firebase emulators:exec --project demo-skillspring --only auth,firestore 'node scripts/local.mjs test && node scripts/local.mjs seed && npm run test:e2e'
      - name: Build without production credentials
        run: node scripts/local.mjs build
